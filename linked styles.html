<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKED STYLES</title>
<style>
body{
    margin:0;
    padding:0;
    background-color: BLACK;
    font-family: Arial, sans-serif;
}
#page{
    background-color: #f2f2f2;
    margin: 0 3.3%;
    padding: 12px 20px 20px;
}
h1{
    text-align: center;
    font-size: 21px;
    font-size: bold;
    margin:10px 0 0;
    padding-bottom: 1px;
    border-bottom: 3px solid orange;
}
p{
    font-family: Georgia, serif;
    font-size: 11px;
    line-height: 1.6;
    margin-top: 14px;
    margin-bottom: 0;
}
a{
    color:blue;
}
</style>
</head> 
<body> 
<div id="page"> 
<h1>HTML With Linked Style</h1> 
<p
>Cascading Style Sheets 2.1 as defined by the
<a href="http://www.w3.org">W3C</a>provides
powerful page layout facilities.The technology
depends on correct markup so make sure you get that right too!
</p> 
</div> 
</body> 
</html>
